name: Build APK
on:
  workflow_run:
    workflows: ["Organize files"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check project files
        run: |
          missing=0
          for f in \
            settings.gradle \
            build.gradle \
            gradle.properties \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/res/xml/accessibility_config.xml \
            app/src/main/res/xml/device_admin.xml \
            app/src/main/res/values/strings.xml \
            app/src/main/java/com/lockguard/app/AdminReceiver.kt \
            app/src/main/java/com/lockguard/app/Core.kt \
            app/src/main/java/com/lockguard/app/GuardService.kt \
            app/src/main/java/com/lockguard/app/MainActivity.kt \
            app/src/main/java/com/lockguard/app/PasswordActivity.kt \
            app/src/main/java/com/lockguard/app/AppLockActivity.kt \
            app/src/main/java/com/lockguard/app/AppPickerActivity.kt
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file: $f"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key found. This build gets a random key and cannot update an installed copy."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace -Pvc=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SecurityApp.apk

      - name: Write summary
        run: |
          size=$(du -h SecurityApp.apk | cut -f1)
          echo "### APK built ($size)" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: build-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Save build reports if the build failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports
          if-no-files-found: ignore

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Debug APK, signed with the debug key. Tap the APK below to install."
          files: SecurityApp.apk
          fail_on_unmatched_files: true
          make_latest: true
