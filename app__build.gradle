plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.lockguard.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.lockguard.app"
        minSdk 28
        targetSdk 34
        // GitHub passes the run number, so every build is newer than the last
        versionCode Integer.parseInt(project.findProperty('vc')?.toString() ?: '1')
        versionName "1.0"
    }
    signingConfigs {
        fixed {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "lockguard"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // Same key every build, so a new APK installs over the old one
            if (System.getenv("KEYSTORE_FILE")) {
                signingConfig signingConfigs.fixed
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
