name: Organize files
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Replace old files with new uploads
        run: |
          J=app/src/main/java/com/lockguard/app

          # Name recognition: returns the correct path for a known file name.
          # Any other name with "__" in it is turned into a path automatically.
          target() {
            case "$1" in
              dot-github*) ;;
              AndroidManifest.xml) echo "app/src/main/AndroidManifest.xml";;
              accessibility_config.xml) echo "app/src/main/res/xml/accessibility_config.xml";;
              device_admin.xml) echo "app/src/main/res/xml/device_admin.xml";;
              strings.xml) echo "app/src/main/res/values/strings.xml";;
              AdminReceiver.kt) echo "$J/AdminReceiver.kt";;
              Core.kt) echo "$J/Core.kt";;
              GuardService.kt) echo "$J/GuardService.kt";;
              MainActivity.kt) echo "$J/MainActivity.kt";;
              PasswordActivity.kt) echo "$J/PasswordActivity.kt";;
              AppLockActivity.kt) echo "$J/AppLockActivity.kt";;
              AppPickerActivity.kt) echo "$J/AppPickerActivity.kt";;
              *__*) echo "${1//__//}";;
            esac
          }

          # Phone duplicates like "Core (1).kt" count as the same file;
          # a higher number is newer and is processed last, so it wins.
          for f in *; do
            [ -f "$f" ] || continue
            clean=$(echo "$f" | sed -E 's/ ?\([0-9]+\)(\.[^.]*)$/\1/')
            n=$(echo "$f" | sed -nE 's/^.*\(([0-9]+)\)\.[^.]*$/\1/p')
            n=${n:-0}
            t=$(target "$clean")
            [ -n "$t" ] || continue
            echo "$n|$f|$t"
          done | sort -t'|' -k1,1n | while IFS='|' read -r n f t; do
            git rm -qf --ignore-unmatch "$t"
            mkdir -p "$(dirname "$t")"
            git mv -f "$f" "$t"
            echo "Replaced $t using $f"
          done

          # Old leftovers from earlier versions
          git rm -rqf --ignore-unmatch "$J/DeviceAdminUtil.kt" deleted "gone. exe" github

          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "Organize uploaded files"
            git push origin HEAD
          fi
