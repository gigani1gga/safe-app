name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Name the APK
        id: apk
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          [ -z "$APK" ] && echo "No APK was produced" && exit 1
          NAME="app-debug-${GITHUB_SHA::7}.apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Replace the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # delete every older release and its tag
          for tag in $(gh release list --limit 200 --json tagName -q '.[].tagName'); do
            gh release delete "$tag" --cleanup-tag --yes || true
          done
          # publish the new one
          gh release create latest "${{ steps.apk.outputs.name }}" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Built from commit ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"

      - name: Keep only the newest artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.apk.outputs.name }}
          overwrite: true
          retention-days: 1
          if-no-files-found: error
